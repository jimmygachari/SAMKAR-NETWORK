
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client Login | SAMKAR Network Solutions</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="login-header">
        <a href="index.html" class="brand">
            <span class="brand-icon">〰</span>
            <span>
                <strong>SAMKAR</strong>
                <small>NETWORK SOLUTIONS</small>
            </span>
        </a>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>
    </header>

    <main class="login-page">

        <section class="login-card">

            <div class="login-icon">↗</div>

            <p class="eyebrow">EXISTING CLIENTS ONLY</p>

            <h1>Welcome Back</h1>

            <p class="description">
                Log in to your SAMKAR client account.
            </p>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">Email or Username</label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Enter your email or username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    Log In <span>→</span>
                </button>

                <p id="login-message" class="login-message"
                   role="status" aria-live="polite"></p>

            </form>

            <div class="security-note">
                <span>◆</span>
                Secure access for registered SAMKAR clients
            </div>

            <a href="index.html#contact" class="help-link">
                Need help accessing your account? Contact us
            </a>

        </section>

    </main>

    <footer class="login-footer">
        © 2026 SAMKAR Network Solutions. All Rights Reserved.
    </footer>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("toggle-password");
        const loginForm = document.getElementById("login-form");
        const loginMessage = document.getElementById("login-message");

        togglePassword.addEventListener("click", function () {
            const showingPassword = passwordInput.type === "text";

            passwordInput.type = showingPassword ? "password" : "text";
            this.textContent = showingPassword ? "Show" : "Hide";

            this.setAttribute(
                "aria-label",
                showingPassword ? "Show password" : "Hide password"
            );
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            loginMessage.textContent =
                "Client authentication is not connected yet. Please contact SAMKAR to arrange access.";

            loginMessage.className = "login-message";
        });
    </script>

</body>
</html>
